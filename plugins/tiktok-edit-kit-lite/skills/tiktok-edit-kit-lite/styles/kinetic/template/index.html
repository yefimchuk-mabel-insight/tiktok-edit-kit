<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000000; }
    </style>
  </head>
  <body>
    <!-- Kinetic text edit, vertical 1080×1920, 30 fps. Length = the TikTok sound (here an 8 s demo = 240 frames).
         All timing lives in compositions/kinetic.html → WORDS (frame, text, flags). Silent on purpose: add the sound in TikTok. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="kinetic" data-composition-id="kinetic" data-composition-src="compositions/kinetic.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
